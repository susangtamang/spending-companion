name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spending_companion
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: spending_companion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spending_companion -d spending_companion_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spending_companion:local-development-only@127.0.0.1:5432/spending_companion_test?schema=public
      TEST_DATABASE_URL: postgresql://spending_companion:local-development-only@127.0.0.1:5432/spending_companion_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @spending-companion/persistence
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run doctor
      - run: npm audit --omit=dev --audit-level=critical
